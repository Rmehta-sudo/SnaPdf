[package]
name = "snappdf"
version = "0.1.0"
edition = "2024"
description = "A fast, project-oriented PDF viewer for Linux"
license = "MIT"

[dependencies]
anyhow = "1.0"
crossbeam-channel = "0.5"
dirs = "6.0"
eframe = { version = "0.35.0", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
image = { version = "0.25", default-features = false }
pdfium-bundled = { version = "0.2", features = ["bundled"] }
rfd = { version = "0.17.2", default-features = false, features = ["pollster", "xdg-portal"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"

[target.'cfg(target_os = "linux")'.dependencies]
raw-window-handle = "0.6"
x11rb = { version = "0.13.2", features = ["xinput"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
