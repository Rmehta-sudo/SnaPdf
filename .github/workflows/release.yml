name: Release AppImage

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config curl ca-certificates \
            libfontconfig1-dev libfreetype6-dev libxkbcommon-dev libwayland-dev \
            libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Build AppImage
        run: ./scripts/build-appimage.sh

      - name: Create checksum
        run: |
          cp scripts/install-appimage.sh dist/install-snapdf.sh
          chmod +x dist/install-snapdf.sh
          cd dist
          sha256sum *.AppImage install-snapdf.sh > SHA256SUMS

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: SnaPdf-AppImage
          path: |
            dist/*.AppImage
            dist/install-snapdf.sh
            dist/SHA256SUMS

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/*.AppImage dist/install-snapdf.sh dist/SHA256SUMS \
            --generate-notes \
            --title "SnaPdf ${GITHUB_REF_NAME}"
